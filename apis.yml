name: Hong Kong Asia Medical Group
description: 'Hong Kong Asia Medical Group (HK Asia Medical Group) is a cardiovascular-focused
  healthcare group established in 1999, beginning with Wuhan Asia Heart Hospital. It operates
  across Mainland China, Hong Kong SAR, Japan and Indonesia, running hospitals and cardiac
  centres including Wuhan Asia Heart Hospital, Wuhan Asia General Hospital, Xinjiang
  Cardio-cerebrovascular Hospital, Sapporo Heart Center, Hong Kong Asia Heart Centre, Bali
  International Hospital and Shantou Cardiac Surgery Centre. Its work spans clinical medical
  practice, medical education and cardiovascular research, serving over 8.5 million patients
  with more than 5,200 medical staff across seven-plus service cities. It is a portfolio
  company of HongShan (formerly Sequoia Capital China). No public developer or API surface
  was found during enrichment.'
